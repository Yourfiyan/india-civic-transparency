name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: civic
          POSTGRES_PASSWORD: civic
          POSTGRES_DB: civic_transparency
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Initialize DB Schema & Seed
        run: |
          PGPASSWORD=civic psql -h localhost -U civic -d civic_transparency -f db/schema.sql
          PGPASSWORD=civic psql -h localhost -U civic -d civic_transparency -f db/seed.sql
          node cache/generate-topojson.js || true

      - name: Run Backend Tests
        env:
          DATABASE_URL: postgresql://civic:civic@localhost:5432/civic_transparency
          NODE_ENV: test
        run: npm test

  data-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data_pipeline

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies for GDAL/Fiona
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libgdal-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pydantic

      - name: Run Pytest
        run: pytest tests/
